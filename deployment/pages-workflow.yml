name: Publish clean frontend to GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:pages
      - name: Set public API address
        env:
          TAILOR_API_BASE: ${{ vars.TAILOR_API_BASE }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const url=process.env.TAILOR_API_BASE; if(!url || new URL(url).protocol!=="https:") throw Error("Set repository variable TAILOR_API_BASE to your HTTPS API origin before publishing"); fs.writeFileSync("dist-pages/config.js", "window.TAILOR_API_BASE = " + JSON.stringify(url.replace(/\/$/, "")) + ";\n");'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
